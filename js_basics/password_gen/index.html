<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Password generator</title>

  <!-- Tipografía usada para el diseño -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="card-inner">
        <header class="hero">
          <h1 class="title">
            Generate a
            <span class="title--accent">random password</span>
          </h1>
          <p class="subtitle">Never use an insecure password again.</p>

          <button class="btn-generate">Generate passwords</button>
        </header>

        <div class="divider" role="presentation"></div>

        <div class="outputs">
          <div class="output">&gt;nfJyj!dDvR&ial</div>
          <div class="output">eg&lt;xWji@veiPUwK</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
