<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Password generator</title>

  <!-- Tipografía usada para el diseño -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="card-inner">
        <header class="hero">
          <h1 class="title">
            Generate a
            <span class="title--accent">random password</span>
          </h1>
          <p class="subtitle">Never use an insecure password again.</p>

          <!-- Controles: checkbox para activar longitud + textbox deshabilitado por defecto y botón -->
          <div class="controls">
            <label class="length-toggle" for="setLength">
              <input type="checkbox" id="setLength" />
              Set password length
            </label>

            <input
              id="lengthInput"
              type="number"
              min=15
              max=64
              value=15
              disabled
              class="btn-length"
              aria-label="Password length input"
            />

            <button class="btn-generate" 
                id="generateBtn"
                onclick="renderPwd()">
                Generate passwords
            </button>
          </div>
        </header>

        <div class="divider" role="presentation"></div>

        <div class="outputs">
          <div class="output" id="pwd1"></div>
          <div class="output" id="pwd2"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
