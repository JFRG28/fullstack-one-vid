<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">    
    <link rel="stylesheet" href="styles.css">        
    <title>Basketball Scoreboard</title>
    <body>
        <div id="layout">
            <div class="lay-item">
                <h3>HOME</h3>
                <div class="score">0</div>
                <button class="btnIncrement" onclick="add1()">+1</button>
                <button class="btnIncrement" onclick="add2()">+2</button>
                <button class="btnIncrement" onclick="add3()">+3</button>
            </div>            
            <div class="lay-item">
                <h3>GUEST</h3>
                <div class="score">0</div>
                <button class="btnIncrement" onclick="add1()">+1</button>
                <button class="btnIncrement" onclick="add2()">+2</button>
                <button class="btnIncrement" onclick="add3()">+3</button>
            </div> 
        </div>
        <script src="index.js"></script>
    </body>
</html>
