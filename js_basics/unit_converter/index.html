<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metric/Imperial Unit Conversion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <header class="hero-section">
            <h1>Metric/Imperial Unit Conversion</h1>
            
            <div class="input-display-container">                
                <input type="text" id="input-el"/>
            </div>
            
            <button id="convert-btn">Convert</button>
            <script src="index.js"></script>
        </header>

        <section class="results-section">
            
            <article class="result-card">
                <h2>Length (Meter/Feet)</h2>
                <p>20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
            </article>

            <article class="result-card">
                <h2>Volume (Liters/Gallons)</h2>
                <p>20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
            </article>

            <article class="result-card">
                <h2>Mass (Kilograms/Pounds)</h2>
                <p>20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
            </article>

        </section>
    </main>
</body>
</html>
