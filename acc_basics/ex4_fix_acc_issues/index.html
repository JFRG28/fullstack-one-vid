<html>
    <head>
        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
        
        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="index.css">
    </head>
    <body class="contact-page">
        <main id="main">
            <!-- Form section -->
            <section class="contact-form-section">
                <form>
                    <h1 class="contact-form-heading">Reach <span>Out</span></h1>
                    <div class="contact-form-intro">Curious about something? Complete these fields and "get in touch", as you humans say. 🤙</div>
                    <label for="full-name-el">
                        Full name
                    </label>
                    <input 
                        id="full-name-el" 
                        class="contact-input" 
                        type="text" 
                        placeholder="Homer J. Simpson" />
                    <label for="email-el">
                        Email
                    </label>
                    <input 
                        id="email-el" 
                        class="contact-input" 
                        type="text" 
                        placeholder="homer@gmail.com" />
                    <label for="text-el">
                        Your message...
                    </label>
                    <textarea 
                        id="text-el"    
                        class="contact-textarea" 
                        rows="4" 
                        cols="50" 
                        placeholder="Type here"></textarea>
                    <button class="contact-submit-button" type="button" onclick="submitForm()">Send message 🎉</button>
                </form>
                <img 
                    class="contact-image" 
                    src="images/connect.jpg" 
                    alt="A human hand raising trying to touch a robotic white hand which is coming from above"/>
            </section>
        </main>
    </body>
</html>
