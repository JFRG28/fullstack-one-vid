<html>
    <head>
        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
        
        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="style_signup.css">
    </head>
    <body class="contact-page">
        <main id="main">
            <!-- Form section -->
            <section class="contact-form-section">
                <form>
                    <h2 class="contact-form-heading">Sign up</h2>
                    <p class="contact-form-intro">Enter your contact information, and then there will be cake. 🍰</p>
                    <label for="full-name-el">
                        Full name:
                    </label>
                    <input 
                        class="contact-input" 
                        type="text" 
                        placeholder="Homer J. Simpson" 
                        id="full-name-el"/>
                    <label for="address-el">
                        Address:
                    </label>
                    <input 
                        class="contact-input" 
                        type="text" 
                        placeholder="Evergreen terrace #1234" 
                        id="address-el"/>
                    <div class="address">
                        <div class="city">
                            <label for="city-el">
                                City:
                            </label>
                            <input 
                                class="address-input" 
                                type="text" 
                                placeholder="Dallas,Texas" 
                                id="city-el"/>
                        </div>
                        <div class="postcode">
                            <label for="postcode-el">
                                Postcode:
                            </label>
                            <input 
                                class="address-input" 
                                type="text" 
                                placeholder="75001" 
                                id="postcode-el"/>
                        </div>
                    </div>
                    <label for="email-el">
                        E-mail:
                    </label>
                    <input 
                        class="contact-input" 
                        type="text" 
                        placeholder="homer@gmail.com" 
                        id="email-el"/>
                    <div class="radio-container">
                        <fieldset>
                            <legend>Do you have cats?</legend>
                            <label for="yes">Yes</label>
                            <input class="contact-radio" id="yes" type="radio" name="cats" />
                            <label for="no">No</label>
                            <input class="contact-radio" id="no" type="radio" name="cats" />
                        </fieldset>
                        
                    </div>
                    <button class="contact-submit-button" type="button">Send message 🎉</button>
                </form>
                <img class="contact-image" src="images/drone-contact.png" alt="A woman seeing a drone approaching." />
            </section>
        </main>
    </body>
</html>
